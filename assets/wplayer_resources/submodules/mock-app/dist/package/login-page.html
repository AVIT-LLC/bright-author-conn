<html>
    <body>
        <h1>Login Page</h1>
        <p>This is a mock login page for button url dialog with auth</p>
    </body>
    <script>
        const apiAuthLocalStorage = localStorage.getItem('app-auth-storage') === 'true'
        const isDialog = localStorage.getItem('app-auth-dialog') === 'true'

        if (apiAuthLocalStorage) {
            localStorage.setItem('key-in-localstorage', '[{"service": "Dynamic Service 1 - vxt authentication dynamic service","authData": "Auth Data 1", "guide": {"type":"guide", "message": "test"}},{"service": "DynamicStorage 2","authData": "Auth Data 2"}]');
       }

        if (isDialog) {
            const button = document.createElement('button');
            button.textContent = 'Close';
            button.onclick = function () {
                localStorage.setItem('appAuth', 'close');
            };
            document.body.appendChild(button);
        }
    </script>
</html>
