<html>
    <head>
        <script>
            let outputConfig = null,
                channel;
            
            // Function to toggle visibility of a section
            function toggleSection(sectionId, checkboxId) {
                const section = document.getElementById(sectionId);
                const checkbox = document.getElementById(checkboxId);
                if (section) {
                    section.style.display = checkbox.checked ? 'block' : 'none';
                }
            }
            
            // Function to initialize all sections as hidden
            function initializeSections() {
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = false;
                    const sectionId = checkbox.id.replace('Checkbox', 'Section');
                    const section = document.getElementById(sectionId);
                    if (section) {
                        section.style.display = 'none';
                    }
                });
            }
            
            // Call initializeSections when the page loads
            document.addEventListener('DOMContentLoaded', initializeSections);
            function getDiff(config) {
                for (let cat in config) {
                    for (let id in config[cat]) {
                        if (JSON.stringify(config[cat][id]) !== JSON.stringify(outputConfig[cat][id])) {
                            return `${id}: ${JSON.stringify(outputConfig[cat][id])} -> ${JSON.stringify(config[cat][id])}`
                        }
                    }
                }
            }
            function isLogger() {
                return localStorage.getItem('app-verbose') === 'true';
            }
            function configChanged(config) {
                if (isLogger()) {
                    console.debug('[VXT App] new config', config);
                }
                if(config.Input.errorText === 'error') {
                    setTimeout(() => {
                        channel.publish('data', {
                            type: 'configError',
                            payload: [
                                {
                                    id: 'errorText',
                                    error: 'Error in the sent config.',
                                    errorDetails: 'Error in the sent config.'
                                }
                            ]
                        });
                    }, 2000);
                    return
                }
                if (outputConfig) {
                    div = document.querySelector('#placeholder');
                    div.textContent = getDiff(config) ?? div.textContent;
                }
                else {
                    div = document.querySelector('#placeholder');
                    div.textContent = `I've got a config`;
                }
                outputConfig = config;
            }
            function newPlayState(playState) {
                const playStates = document.querySelector('.play-states');
                playStates.innerHTML += `${playState}<br/>`;
                if (playState === 'stop') {
                    $vxt.closeChannel($vxtSubChannelId);
                    if (isLogger()) {
                        console.debug('[VXT App] channel closed', $vxtSubChannelId);
                    }
                }
                if (playState === 'ready') {
                    channel.publish('toastMessage', {
                        type: 'info',
                        payload: {
                            message: 'Test message'
                        }
                    });
                    channel.publish('toastMessage', {
                        type: 'warning',
                        payload: {
                            message: 'Test message'
                        }
                    });
                    channel.publish('toastMessage', {
                        type: 'error',
                        payload: {
                            message: 'Test message'
                        }
                    });
                    channel.publish('toastMessage', {
                        type: 'success',
                        payload: {
                            message: 'Test message'
                        }
                    });
                }
            }
            function getStorage(key) {
                channel.publish('get', {
                    type: 'storage',
                    payload: {
                        prefix: 'mock',
                        key
                    }
                })
            }
            function newCanvasState(canvasState) {
                const playStates = document.querySelector('.canvas-states');
                playStates.innerHTML += `${canvasState}<br/>`
            }
            function createChannel() {
                channel = $vxt.createChannel($vxtSubChannelId);
                channel.subscribe('config', (payload) => configChanged(payload.data));
                channel.subscribe('playstate', (payload) => newPlayState(payload.type));
                channel.subscribe('vxtstate', (payload) => newCanvasState(payload.type));
                channel.subscribe('data:mock', (payload) => {
                    if (isLogger()) {
                        console.debug('[VXT App] data:mock', JSON.stringify(payload));
                    }
                });
                channel.subscribe('data:broadcast-test', (payload) => {
                    if (isLogger()) {
                        console.debug('[VXT App] data:broadcast-test', JSON.stringify(payload));
                    }
                });

                if (isLogger()) {
                    console.debug('[VXT App] channel created', $vxtSubChannelId);
                }
            }
            function waitForVxtApi(callback) {
                const interval = setInterval(() => {
                    if (window.$vxt) {
                        clearInterval(interval);
                        createChannel();
                    }
                }, 100)
            }
            function setAccordionViewState(state) {
                    channel.publish('data', {
                        type: 'widgetManifest',
                        payload: {
                            Display: [
                                {
                                    id: 'accordion1',
                                    viewState: state
                                }
                            ]

                    });
            }

                    channel.publish('data', {
                        type: 'widgetManifest',
                        payload: {
                            Input: [
                                {
                                    id: 'new-component2',
                                    type: 'text',
                                    caption: 'Component before',
                                    value: 'hello',
                                    label: "Just added",
                                    size: "large"
                                },
                                {
                                    id: 'inputFontSize0',
                                    value: 40

            function addAtEnd() {
                setTimeout(() => {
                    channel.publish('data', {
                        type: 'widgetManifest',
                        payload: {
                            Input: [
                                {
                                    id: 'new-component3',
                                    type: 'text',
                                    caption: 'Component at end',
                                    value: 'hello',
                                    label: "Just added",
                                    size: "large"
                                }
                            ]

            function changeValues() {
                setTimeout(() => {
                    channel.publish('data', {
                        type: 'widgetManifest',
                        payload: {
                            Input: [
                                {
                                    id: 'inputZipCode20',
                                    value: 'changed'
                                },
                                {
                                    id: 'inputFontSize0',
                                    value: 60
                                }
                            ]

                    });
                }, 2000);
            }
            function loadApp() {
                setTimeout(() => {
                    channel.publish('control', {
                        type: 'execute',
                        payload: {
                            command: 'loadApp'
                        }
                    });
                }, 100);
            }
            function loadAppAndShow() {
                setTimeout(() => {
                    channel.publish('control', {
                        type: 'execute',
                        payload: {
                            command: 'loadApp',
                            loadAndShow: true
                        }
                    });
                }, 100);
            }
            let counter = 0;
            function broadcast() {
                channel.publish('set', {
                    type: 'broadcast',
                    payload: {
                        'broadcast-test': {
                            'extension-key': `extension-value-${++counter}`,
                            'extension-key-2': `extension-value-${++counter}`
                        },
                        'broadcast-test-2': {
                            'extension-key': `extension-value-${++counter}`
                        }
                    }
                });
            }
            function setStorage() {
                channel.publish('set', {
                    type: 'storage',
                    payload: {
                        mock: {
                            'widget-key': 'widget-value'
                        }
                    }
                })
            }
            function widgetManifestTest(val) {
                let payload;
                switch(val) {
                    case 1:
                        payload = {
                            Display: [
                                {
                                    id: 'accordion1',
                                    list: [
                                        {
                                            id: 'innerAccordion',
                                            list: [
                                                {
                                                    type: 'toggle',
                                                    id: 'widgetManifestTest1',
                                                    caption: 'Widget Manifest Test 1 (added)',
                                                    value: false
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                        break;
                    case 2:
                        payload = {
                            Display: [
                                {
                                    id: 'accordion1',
                                    list: [
                                        {
                                            id: 'innerAccordion',
                                            list: [
                                                {
                                                    id: 'toggleNavAudioAc11',
                                                    value: false
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                        break;
                    case 3:
                        payload = {
                            Display: [
                                {
                                    id: 'accordion2',
                                    list: [
                                        {
                                            id: 'tabs',
                                            categories: [
                                                {
                                                    name: 'Image',
                                                    attachedComponents: ['widgetManifestTest3', 'tabel1', 'tabel2']
                                                },
                                                {
                                                    name: 'Background',
                                                    icon: '../images/favicon.svg',
                                                    attachedComponents: ['tabel3', 'tabel4']
                                                },
                                                {
                                                    name: 'Tab3',
                                                    attachedComponents: ['tabel5']
                                                },
                                                {
                                                    name: 'Tab6',
                                                    attachedComponents: [],
                                                    disabled: true
                                                }
                                            ],
                                            list: [
                                                {
                                                    type: 'toggle',
                                                    id: 'widgetManifestTest3',
                                                    caption: 'Widget Manifest Test 3 (added)',
                                                    value: false
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                        break;
                    case 4:
                        payload = {
                            Display: [
                                {
                                    id: 'accordion2',
                                    list: [
                                        {
                                            id: 'tabs',
                                            list: [
                                                {
                                                    id: 'tabel1',
                                                    value: 'Widget Manifest Test 4 (changed)',
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                        break;
                }

                setTimeout(() => {
                    channel.publish('data', {
                        type: 'widgetManifest',
                        payload
                    });
                }, 1000);
            }

                setTimeout(() => {

                                }
                            ]

            }

            async function changeThumbnail(payload = {}, oldFormat = false) {
                setTimeout(() => {
                    channel.publish('data', {
                        type: 'widgetThumbnail',
                        payload: oldFormat ? img : { thumbnail: img, ...payload }
                    });
                }, 2000);
            }
            function resize() {
                setTimeout(() => {
                    channel.publish('data', {
                        type: 'widgetSize',
                        payload: {
                            width: 800,
                            height: 600
                        }
                    });
                }, 2000);
            }
            waitForVxtApi();

    <body>
        <div style="margin-top: 50px;">
            <button onclick="addBefore()">add before number input</button>
            <button onclick="addAfter()">add after number input</button>
            <button onclick="addAtEnd()">add at end</button>
            <button onclick="changeValues()">Change values</button>
            <button onclick="loadApp()">Load App</button>
            <button onclick="loadAppAndShow()">Load and Show App</button>
            
            <div>
                <label><input type="checkbox" id="viewEventsCheckbox" onclick="toggleSection('viewEventsSection', 'viewEventsCheckbox')"> View events</label>
                <div id="viewEventsSection">
                    <button onclick="changeThumbnail({}, true)">Change thumbnail (just image)</button>
                    <button onclick="changeThumbnail({ width: 100, height: 100 })">Change thumbnail (+size)</button>
                    <button onclick="changeThumbnail({ x: 20, y: 20 })">Change thumbnail (+position)</button>
                    <button onclick="changeThumbnail({ width: 100, height: 100, x: 20, y: 20 })">Change thumbnail (+size +position)</button>
                    <button onclick="resize()">Resize</button>
                </div>
            </div>
            
            <div>
                <label><input type="checkbox" id="widgetManifestCheckbox" onclick="toggleSection('widgetManifestSection', 'widgetManifestCheckbox')"> Widget manifset test</label>
                <div id="widgetManifestSection">
                    <button onclick="widgetManifestTest(1)">1</button><span>Add an element to the Inner accordion</span>
                    <br />
                    <button onclick="widgetManifestTest(2)">2</button><span>Change the Inner radio's value</span>
                    <br />
                    <button onclick="widgetManifestTest(3)">3</button><span>Add an element to the IMAGE tab in TABS</span>
                    <br />
                    <button onclick="widgetManifestTest(4)">4</button><span>Change the Text element's value in IMAGE tab</span>
                </div>
            </div>
            
            <div>
                <label><input type="checkbox" id="enableControlsCheckbox" onclick="toggleSection('enableControlsSection', 'enableControlsCheckbox')"> Enable Controls Test</label>
                <div id="enableControlsSection">
                    <button onclick="enableDropdownAndNumber()">Enable Dropdown & Number</button><span>Set viewState: 'show' for dropdown and number components</span>
                </div>
            </div>
            
            <div>
                <label><input type="checkbox" id="storageCheckbox" onclick="toggleSection('storageSection', 'storageCheckbox')"> Storage</label>
                <div id="storageSection">
                    <button onclick="setStorage()">Set storage</button>
                    <button onclick="getStorage('widget-key')">Get widget-key</button>
                    <button onclick="getStorage('extension-key')">Get extension-key</button>
                    <button onclick="broadcast()">Broadcast</button>
                </div>
            </div>
            
            <div>
                <label><input type="checkbox" id="accordionViewStateCheckbox" onclick="toggleSection('accordionViewStateSection', 'accordionViewStateCheckbox')"> Accordion View State</label>
                <div id="accordionViewStateSection">
                    <button onclick="setAccordionViewState('show')">Show Accordion</button>
                    <button onclick="setAccordionViewState('hide')">Hide Accordion</button>
                    <button onclick="setAccordionViewState('disable')">Disable Accordion</button>
                </div>
            </div>
            
            <div id="placeholder">
                Waiting for changes ...
            </div>
            <br/>
            <div class="play-states">
                Received play states:
                <br/>
            </div>
            <br/>
            <div class="canvas-states">
                Received canvas states:
                <br/>
            </div>
        </div>
    </body>
</html>
